name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: gradle assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TheLastHour_ProjectEcho.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: "The Last Hour: Project Echo Mobile (v1.0)"
          body: "Direct APK download for Android phone. Tap TheLastHour_ProjectEcho.apk below to install!"
          files: app/build/outputs/apk/debug/TheLastHour_ProjectEcho.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheLastHour_ProjectEcho_APK
          path: app/build/outputs/apk/debug/TheLastHour_ProjectEcho.apk
          retention-days: 14
