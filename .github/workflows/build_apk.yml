name: Build The Last Hour Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev \
            libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake autoconf automake libtool openjdk-17-jdk

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython

      - name: Build Android APK with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheLastHour_ProjectEcho_Android_APK
          path: bin/*.apk
          retention-days: 14
