    namespace 'org.projectecho.thelasthour'
    compileSdk 34

    defaultConfig {
        applicationId "org.projectecho.thelasthour"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
